name: Manage Flask App Helm Chart

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Which Helm action to run'
        required: true
        default: 'install'
        type: choice
        options:
          - install
          - upgrade
          - remove

permissions:
  id-token: write
  contents: read

env:
  TF_VAR_aws_account_id:    ${{ secrets.AWS_ACCOUNT_ID }}
  TF_VAR_GithubActionsRole: ${{ vars.GithubActionsRole }}
  TF_VAR_DOMAIN_NAME:       ${{ vars.DOMAIN_NAME }}
  TF_VAR_prefix:            ${{ vars.PREFIX }}

jobs:
  install:
    if: ${{ github.event.inputs.action == 'install' }}
    name: Install Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.TF_VAR_aws_account_id }}:role/${{ env.TF_VAR_GithubActionsRole }}
          aws-region: us-west-2
      - name: Get K3s Config from SSM
        run: |
          aws ssm get-parameter \
            --name "/rsschool/k3s-yaml" \
            --with-decryption \
            --query "Parameter.Value" \
            --region us-west-2 \
            --output text > k3s-config.yaml
      - name: Set up Kubeconfig
        run: |
          pwd
          ls
          cat k3s-config.yaml
          echo "---------------------------"
          if grep -q "127.0.0.1\|localhost" k3s-config.yaml; then
            sed -i "s/127.0.0.1/${{ secrets.K3S_NODE_IP }}/g" k3s-config.yaml
            sed -i "s/localhost/${{ secrets.K3S_NODE_IP }}/g" k3s-config.yaml
          fi
          echo "---------------------------"
          cat k3s-config.yaml
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'
      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'
      - name: Install Helm Chart
        run: |
          export KUBECONFIG=../../../k3s-config.yaml
          helm upgrade --install flask-app . --set ingress.host=flask-app.${{ vars.DOMAIN_NAME }}
        working-directory: K3S_Manifests/Mod3_Task5/flask_app_HelmChart

      - name: Get EC2 Public IP
        id: get_ec2_ip
        run: |
          #echo "Looking for EC2 instance with tag Name=rsschool-node-1"
          echo "Looking for EC2 instance with tag Name=${{ vars.prefix }}-node-1"
          IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${{ vars.prefix }}-node-1" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)
          if [ "$IP" = "None" ] || [ -z "$IP" ]; then
            echo "Warning: Could not find IP for instance with tag ${{ vars.prefix }}-node-1"
            echo "external_ip=Not available" >> $GITHUB_OUTPUT
          else
            echo "Found IP: $IP"
            echo "external_ip=$IP" >> $GITHUB_OUTPUT
          fi

      # - name: Update Route53 Record
      #   run: |
      #     cat > change-batch.json <<EOF
      #     {
      #       "Comment": "Update flask-app record",
      #       "Changes": [{
      #         "Action": "UPSERT",
      #         "ResourceRecordSet": {
      #           "Name": "flask-app.${{ vars.DOMAIN_NAME }}",
      #           "Type": "A",
      #           "TTL": 300,
      #           "ResourceRecords": [{ "Value": "${{ steps.get_ec2_ip.outputs.external_ip }}" }]
      #         }
      #       }]
      #     }
      #     EOF

      #     aws route53 change-resource-record-sets \
      #       --hosted-zone-id ${{ secrets.ROUTE53_ZONE_ID }} \
      #       --change-batch file://change-batch.json
      #   env:
      #     AWS_REGION: us-west-2

      - name: Output Access Information
        run: |
          echo "## Flask App Access Information" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Flask Application has been successfully installed!**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Access Information:**" >> $GITHUB_STEP_SUMMARY
          echo "- Domain: http://flask-app.${{ vars.DOMAIN_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- IP Address: ${{ steps.get_ec2_ip.outputs.external_ip }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Application Status:**" >> $GITHUB_STEP_SUMMARY
          echo "- Check if the application is ready by visiting the domain above" >> $GITHUB_STEP_SUMMARY
          echo "- If using Route53, DNS propagation may take a few minutes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Troubleshooting:**" >> $GITHUB_STEP_SUMMARY
          echo "- If the domain doesn't work, try accessing via IP: http://${{ steps.get_ec2_ip.outputs.external_ip }}" >> $GITHUB_STEP_SUMMARY
          echo "- Check pod status: kubectl get pods -n default" >> $GITHUB_STEP_SUMMARY

  upgrade:
    if: ${{ github.event.inputs.action == 'upgrade' }}
    name: Upgrade Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.TF_VAR_aws_account_id }}:role/${{ env.TF_VAR_GithubActionsRole }}
          aws-region: us-east-2
      - name: Get K3s Config from SSM
        run: |
          aws ssm get-parameter \
            --name "/rsschool/k3s-yaml" \
            --with-decryption \
            --query "Parameter.Value" \
            --region us-west-2 \
            --output text > k3s-config.yaml
      - name: Set up Kubeconfig
        run: |
          if grep -q "127.0.0.1\|localhost" k3s-config.yaml; then
            sed -i "s/127.0.0.1/${{ secrets.K3S_NODE_IP }}/g" k3s-config.yaml
            sed -i "s/localhost/${{ secrets.K3S_NODE_IP }}/g" k3s-config.yaml
          fi
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'
      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'
      - name: Upgrade Helm Chart
        run: |
          export KUBECONFIG=../../../k3s-config.yaml
          helm upgrade --install flask-app . --set ingress.host=flask-app.${{ vars.DOMAIN_NAME }}
        working-directory: K3S_Manifests/Mod3_Task5/flask_app_HelmChart

      - name: Get EC2 Public IP
        id: get_ec2_ip
        run: |
          IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${{ vars.prefix }}-node-1" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)
          echo "external_ip=$IP" >> $GITHUB_OUTPUT


      - name: Output Access Information
        run: |
          echo "## Flask App Access Information" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Flask Application has been successfully upgraded!**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Access Information:**" >> $GITHUB_STEP_SUMMARY
          echo "- Domain: http://flask-app.${{ vars.DOMAIN_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- IP Address: ${{ steps.get_ec2_ip.outputs.external_ip }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Application Status:**" >> $GITHUB_STEP_SUMMARY
          echo "- The application has been updated with the latest changes" >> $GITHUB_STEP_SUMMARY
          echo "- Check if the application is ready by visiting the domain above" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Troubleshooting:**" >> $GITHUB_STEP_SUMMARY
          echo "- If the domain doesn't work, try accessing via IP: http://${{ steps.get_ec2_ip.outputs.external_ip }}" >> $GITHUB_STEP_SUMMARY
          echo "- Check pod status: kubectl get pods -n default" >> $GITHUB_STEP_SUMMARY

  remove:
    if: ${{ github.event.inputs.action == 'remove' }}
    name: Remove Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.TF_VAR_aws_account_id }}:role/${{ env.TF_VAR_GithubActionsRole }}
          aws-region: us-east-2
      - name: Get K3s Config from SSM
        run: |
          aws ssm get-parameter \
            --name "/rsschool/k3s-yaml" \
            --with-decryption \
            --query "Parameter.Value" \
            --region us-west-2 \
            --output text > k3s-config.yaml
      - name: Set up Kubeconfig
        run: |
          if grep -q "127.0.0.1\|localhost" k3s-config.yaml; then
            sed -i "s/127.0.0.1/${{ secrets.K3S_NODE_IP }}/g" k3s-config.yaml
            sed -i "s/localhost/${{ secrets.K3S_NODE_IP }}/g" k3s-config.yaml
          fi
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'
      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'
      - name: Uninstall Helm Chart
        run: |
          export KUBECONFIG=../../../k3s-config.yaml
          helm uninstall flask-app
        working-directory: K3S_Manifests/Mod3_Task5/flask_app_HelmChart

 
