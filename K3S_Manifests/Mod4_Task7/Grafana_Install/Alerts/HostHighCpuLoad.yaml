apiVersion: v1
kind: ConfigMap
metadata:
  name: cpu-alerts-grafana-rules
  namespace: monitoring
  labels:
    grafana_alert: "1"
data:
  HostHighCpuLoad.yaml: |
    apiVersion: 1
    groups:
    - orgId: 1
      name: RsSchool_30sec_Evaluation_v1.0
      folder: RSSchool_Alerts
      interval: 30s
      rules:
        - uid: bet2eydufecxsd
          title: RsSchool High CPU
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: bet2decg643cwb
              model:
                editorMode: code
                expr: rate(node_cpu_seconds_total{job="node-exporter", mode="user"}[$__rate_interval]) * 100
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 50
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 30s
          isPaused: false
          notification_settings:
            receiver: RsSchool

