apiVersion: v1
kind: ConfigMap
metadata:
  name: rsscool-alerts-grafana-rules
  namespace: monitoring
  labels:
    grafana_alert: "1"
data:
  RsSchoolAlerts.yaml: |
    apiVersion: 1
groups:
    - orgId: 1
      name: RsSchool_30sec_Evaluation
      folder: RsSchool_Alerts
      interval: 1m
      rules:
        - uid: aet37c3nrdkhsd
          title: RsSchool-CpuLoad
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: aet36gpv077y8f
              model:
                editorMode: code
                expr: rate(node_cpu_seconds_total{job="node-exporter", mode="user"}[$__rate_interval]) * 100
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 80
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 1m
          isPaused: false
          notification_settings:
            receiver: RsSchool
        - uid: bet37m4b0m58gc
          title: RsSchool-RAMUsage
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: aet36gpv077y8f
              model:
                editorMode: code
                expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 50
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 1m
          annotations: {}
          labels: {}
          isPaused: false
          notification_settings:
            receiver: RsSchool
